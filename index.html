<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日吃什么？随机点餐助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 30px 20px;
            overflow: hidden;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .prize-box {
            width: 300px;
            height: 300px;
            margin: 0 auto 40px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1), 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            padding: 20px;
            word-break: break-all;
            overflow: hidden;
        }
        .prize-box.running {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            animation: pulse 0.5s infinite alternate;
        }
        .prize-box.stopped {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            margin: 10px 20px;
            text-decoration: none;
            user-select: none;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 20px rgba(0, 0, 0, 0.3);
        }
        .btn:active {
            transform: translateY(-2px);
        }
        .btn-stop {
            background: linear-gradient(to right, #ff5e62, #ff9966);
        }
        .history {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .history h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }
        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .prize-box {
                width: 250px;
                height: 250px;
                font-size: 28px;
            }
            .btn {
                padding: 15px 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 今天吃什么？ 🎉</h1>
        <div class="prize-box" id="prizeBox">等待开始</div>
        <div>
            <button class="btn" id="startBtn">开始抽奖</button>
            <button class="btn btn-stop" id="resetBtn">重置记录</button>
        </div>
        <div class="history">
            <h2>历史记录</h2>
            <div class="history-list" id="historyList"></div>
        </div>
        <div class="footer">
            <p>点击"开始抽奖"随机选择，再点击停止确定今日美食！</p>
        </div>
    </div>

    <script>
        // 奖品数组
        const goods = [
            "麻辣烫", "鱼粉", "麻辣拌", 
            "螺蛳粉", "砂锅", "香锅",
            "意面",  "火锅", "盖浇饭", "椒麻鸡",
            "地锅鸡", "烤鱼", "肉夹馍", "米线", "烤肉"
        ];

        // 获取DOM元素
        const prizeBox = document.getElementById('prizeBox');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const historyList = document.getElementById('historyList');

        let isRunning = false;
        let timer = null;
        let speed = 80; // 初始速度（ms）
        let history = JSON.parse(localStorage.getItem('lunchHistory')) || [];

        // 初始化历史记录显示
        updateHistoryDisplay();

        // 开始/停止按钮点击事件
        startBtn.addEventListener('click', function() {
            if (!isRunning) {
                // 开始抽奖
                isRunning = true;
                startBtn.textContent = '停止抽奖';
                startBtn.classList.add('btn-stop');
                prizeBox.classList.remove('stopped');
                prizeBox.classList.add('running');
                
                // 初始快速切换
                speed = 80;
                runLottery();
            } else {
                // 停止抽奖
                stopLottery();
            }
        });

        // 重置按钮点击事件
        resetBtn.addEventListener('click', function() {
            if (confirm('确定要清空历史记录吗？')) {
                history = [];
                localStorage.setItem('lunchHistory', JSON.stringify(history));
                updateHistoryDisplay();
            }
        });

        // 抽奖函数
        function runLottery() {
            if (!isRunning) return;
            
            // 随机选择一个奖品
            const index = Math.floor(Math.random() * goods.length);
            const selected = goods[index];
            prizeBox.textContent = selected;
            
            // 逐渐减速效果
            if (speed < 300) {
                speed += 10;
            }
            
            // 设置下一次切换
            timer = setTimeout(runLottery, speed);
        }

        // 停止抽奖函数
        function stopLottery() {
            isRunning = false;
            clearTimeout(timer);
            
            startBtn.textContent = '开始抽奖';
            startBtn.classList.remove('btn-stop');
            prizeBox.classList.remove('running');
            prizeBox.classList.add('stopped');
            
            // 将当前结果显示为最终选择
            const finalChoice = prizeBox.textContent;
            
            // 添加到历史记录
            if (!history.includes(finalChoice)) {
                history.unshift(finalChoice);
                // 只保留最近10条记录
                if (history.length > 10) {
                    history = history.slice(0, 10);
                }
                localStorage.setItem('lunchHistory', JSON.stringify(history));
                updateHistoryDisplay();
            }
            
            // 显示结果提示
            setTimeout(() => {
                alert(`今天吃：${finalChoice}！`);
            }, 300);
        }

        // 更新历史记录显示
        function updateHistoryDisplay() {
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-item">暂无记录</div>';
                return;
            }
            
            history.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'history-item';
                itemEl.textContent = item;
                historyList.appendChild(itemEl);
            });
        }

        // 添加键盘支持
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                startBtn.click();
            }
        });
    </script>
</body>
</html>
